<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=1920, height=1080">
  <title>Home</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="stage">
    <div id="glow-a" class="glow"></div>
    <div id="glow-b" class="glow"></div>

    <div id="page">
      <header id="top">
        <div id="greeting"></div>
        <div id="timeline">
          <span id="time"></span><span class="divider"></span><span id="date"></span>
          <span id="weather"><span class="divider"></span><span id="w-icon"></span><span id="w-temp"></span><span id="w-text"></span><span id="w-hilo"></span></span>
        </div>
        <div id="hourly"></div>
        <div id="pills"></div>
      </header>
      <div id="appname"></div>
      <div id="rows"></div>
      <div id="ring" class="hide"></div>
    </div>

    <div id="msg"></div>
  </div>
  <script src="config.js"></script>
  <script src="apps.js"></script>
  <script src="app.js"></script>
</body>
</html>
